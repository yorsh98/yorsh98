<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal con el perfil de Jorge Troncoso">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111b2b"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 15px; }
      .prompt { fill: #3fb950; }
      .key { fill: #39d0d8; }
      .val { fill: #c9d1d9; }
      .dim { fill: #8b949e; }
      .hl { fill: #58a6ff; }
      .line { opacity: 0; animation: show 0.4s ease forwards; }
      .l1 { animation-delay: 0.2s; } .l2 { animation-delay: 0.6s; } .l3 { animation-delay: 1.0s; }
      .l4 { animation-delay: 1.4s; } .l5 { animation-delay: 1.8s; } .l6 { animation-delay: 2.2s; }
      .l7 { animation-delay: 2.6s; } .l8 { animation-delay: 3.0s; }
      @keyframes show { to { opacity: 1; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="900" height="300" rx="12" fill="url(#bg)" stroke="#58a6ff" stroke-opacity="0.25"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="24" r="6" fill="#27c93f"/>

  <g class="mono">
    <text x="30" y="68" class="line l1"><tspan class="prompt">jorge@santiago:~$</tspan> <tspan class="val">whoami</tspan></text>
    <text x="30" y="96" class="line l2"><tspan class="key">nombre</tspan><tspan class="dim">:</tspan>      <tspan class="val">Jorge Troncoso</tspan></text>
    <text x="30" y="120" class="line l3"><tspan class="key">rol</tspan><tspan class="dim">:</tspan>         <tspan class="val">IA Developer &amp; Solutions Architect</tspan></text>
    <text x="30" y="144" class="line l4"><tspan class="key">ubicacion</tspan><tspan class="dim">:</tspan>   <tspan class="val">Santiago, Chile</tspan></text>
    <text x="30" y="168" class="line l5"><tspan class="key">foco</tspan><tspan class="dim">:</tspan>        <tspan class="val">Agentes de IA · RAG · Procesamiento documental</tspan></text>
    <text x="30" y="192" class="line l6"><tspan class="key">stack</tspan><tspan class="dim">:</tspan>       <tspan class="val">Laravel · Python · FastAPI · LangGraph · Docker</tspan></text>
    <text x="30" y="216" class="line l7"><tspan class="key">status</tspan><tspan class="dim">:</tspan>      <tspan class="hl">construyendo cosas con IA ✦</tspan></text>
    <text x="30" y="258" class="line l8"><tspan class="prompt">jorge@santiago:~$</tspan> <tspan class="cursor hl">█</tspan></text>
  </g>
</svg>
